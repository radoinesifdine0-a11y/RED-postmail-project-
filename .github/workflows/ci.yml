# ============================================
# CI Workflow - Tests on Pull Requests
# ============================================
# Runs tests on every pull request to main/develop

name: CI - Tests

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    # MongoDB service container for tests
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # ============================================
      # Setup
      # ============================================
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # ============================================
      # Build & Test
      # ============================================
      - name: Build and Run Tests
        run: ./mvnw test -B
        env:
          SPRING_DATA_MONGODB_URI: mongodb://localhost:27017
          SPRING_DATA_MONGODB_DATABASE: store_parcels_test

      # ============================================
      # Upload Test Results
      # ============================================
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: target/surefire-reports/
          retention-days: 7

      - name: Upload Test Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-coverage
          path: target/site/jacoco/
          retention-days: 7

  # ============================================
  # Build Verification
  # ============================================
  build:
    name: Verify Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR (skip tests)
        run: ./mvnw package -DskipTests -B

      - name: Verify Docker Build
        run: docker build -t store-parcels-api:test .
