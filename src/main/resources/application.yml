# ============================================
# Store Parcels API - Application Configuration
# ============================================

spring:
  application:
    name: storeParcelsWS

  # Default profile (override with SPRING_PROFILES_ACTIVE)
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

# Server configuration
server:
  port: ${PORT:8080}
  address: 0.0.0.0  # Bind to all interfaces (IPv4 + IPv6)

# Logging configuration
logging:
  level:
    root: INFO
    com.kantic.storeParcelsWS: DEBUG
    org.springframework.data.mongodb: DEBUG

---
# ============================================
# LOCAL PROFILE - Development on your machine
# ============================================
spring:
  config:
    activate:
      on-profile: local

  data:
    mongodb:
      uri: mongodb://localhost:27017
      database: store_parcels_db

---
# ============================================
# DOCKER PROFILE - Running in Docker container
# ============================================
spring:
  config:
    activate:
      on-profile: docker

  data:
    mongodb:
      # 'mongodb' is the container name from docker-compose
      uri: mongodb://mongodb:27017
      database: store_parcels_db

---
# ============================================
# GCP PROFILE - Cloud Run deployment (Part 4)
# ============================================
spring:
  config:
    activate:
      on-profile: gcp

  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: ${MONGODB_DATABASE:store_parcels_db}

# Health probes for Cloud Run
management:
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
